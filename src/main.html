<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link rel="stylesheet" href="./output.css">
</head>
<body class="bg-[#030303] text-white font-sans antialiased bg-dots flex flex-col justify-between ">

    <header class="w-full max-w-[1440px] mx-auto px-6 md:px-12 pt-6 md:pt-8 flex justify-between items-center bg-transparent">
        <div class="flex items-center">
            <div class="flex items-center space-x-2">
               <img src="./images/Logo (5).png" alt="">
            </div>
        </div>
        
        <nav class="hidden md:flex space-x-10 text-[13px] text-gray-400 font-medium">
            <a href="./main.html" class="text-white transition">Home</a>
            <a href="#" class="hover:text-white transition">Services</a>
            <a href="#" class="hover:text-white transition">Careers</a>
            <a href="#" class="hover:text-white transition">Career Details</a>
            <a href="#" class="hover:text-white transition">Contact</a>
        </nav>

        <div class="flex items-center space-x-4 md:space-x-0">
            <button class="block md:hidden text-gray-400 hover:text-white focus:outline-none">
                <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 6h16M4 12h16M4 18h16"></path>
                </svg>
            </button>
            <a href="#" class="bg-[#007bfe] hover:bg-blue-600 px-4 md:px-6 py-2 md:py-2.5 rounded-lg text-[12px] md:text-[13px] font-semibold transition tracking-wide">
                Contact Us
            </a>
        </div>
    </header>

    <main class="w-full max-w-[1440px] mx-auto px-6 md:px-12 grid grid-cols-1 md:grid-cols-2 gap-10 md:gap-4 items-center flex-grow mt-5">
        
        <div class="space-y-6 md:space-y-8 max-w-xl flex flex-col items-center text-center md:items-start md:text-left mx-auto md:mx-0">
            <h1 class="text-[36px] md:text-[56px] font-extrabold tracking-tight leading-[1.2] md:leading-[1.15]">
                Transforming Data<br class="hidden md:block">
                into <span class="bg-[#007bfe] text-white px-4 md:px-5 py-1 md:py-1.5 rounded-[15px] md:rounded-[20px] inline-block mt-1">Decisions</span>
            </h1>
            
            <p class="text-gray-400 text-[14px] md:text-[15px] leading-relaxed max-w-md opacity-85">
                Leverage the power of machine learning and AI to unlock insights and drive business growth
            </p>
            
            <div>
                <a href="#" class="bg-[#007bfe] hover:bg-blue-600 px-6 py-3 rounded-xl text-[13px] md:text-[14px] font-semibold transition">
                    Book a Meeting
                </a>
            </div>

            <div class="flex flex-col sm:flex-row items-center space-y-2 sm:space-y-0 sm:space-x-3 pt-2 md:pt-4">
                <div class="flex -space-x-2">
                    <img class="w-7 h-7 rounded-full border-2 border-[#030303] bg-gray-600 object-cover" src="https://images.unsplash.com/photo-1534528741775-53994a69daeb?auto=format&fit=crop&w=100&q=80" alt="Client 1">
                    <img class="w-7 h-7 rounded-full border-2 border-[#030303] bg-gray-500 object-cover" src="https://images.unsplash.com/photo-1507003211169-0a1dd7228f2d?auto=format&fit=crop&w=100&q=80" alt="Client 2">
                    <img class="w-7 h-7 rounded-full border-2 border-[#030303] bg-gray-400 object-cover" src="https://images.unsplash.com/photo-1494790108377-be9c29b29330?auto=format&fit=crop&w=100&q=80" alt="Client 3">
                </div>
                <p class="text-[12px] text-gray-400">
                    Over <span class="text-white font-bold">100+</span> clients have worked with us
                </p>
            </div>
        </div>

        <div class="flex justify-center md:justify-end relative pr-0 md:pr-4 order-last md:order-none">
            <div class="absolute w-[250px] md:w-[400px] h-[250px] md:h-[400px] bg-blue-600/10 blur-[100px] md:blur-[150px] rounded-full top-1/2 left-1/2 -translate-x-1/2 -translate-y-1/2 pointer-events-none"></div>
            
            <img src="./images/robot area.png" alt="" class="w-full max-w-[320px] md:max-w-[580px] object-contain relative z-10">
        </div>
    </main>

    <footer class="w-full mt-auto pt-10 md:pt-0">
        <div class="w-full border-t border-purple-900/20"></div>
        
        <div class="max-w-[1300px] mx-auto px-6 md:px-12 py-8 md:py-12 grid grid-cols-2 sm:grid-cols-3 md:flex md:justify-between items-center justify-items-center gap-6 md:gap-4 opacity-85">
            <img src="./images/Card.png" alt="" class="w-28 md:w-40">
            <img src="./images/Logo.png" alt="" class="w-20 md:w-30">
            <img src="./images/Logo (1).png" alt="" class="w-18 md:w-25">
            <img src="./images/Logo (2).png" alt="" class="w-20 md:w-30">
            <img src="./images/Logo (3).png" alt="" class="w-20 md:w-30">
            <img src="./images/Logo (4).png" alt="" class="w-20 md:w-30">
        </div>

        <div class="w-full border-b border-purple-900/20 pb-4"></div>
    </footer>

</body>
</html>
